# /etc/multiwan/politicas.conf
# formato: <ip_origen>, [<puertos>], <protocolo>, <ISP>

# ip_origen: host o red. puertos: [443] [80,443] [8000-8100], [] = cualquiera.
# protocolo: TCP | UDP | TCP/UDP | ICMP. Se evaluan en orden; la primera que coincide decide.
# Sin coincidencia se balancea. Con el ISP de una regla caido se usa el otro.

# USERS, por host
192.168.20.10, [80,443], TCP, ISP1
192.168.20.10, [53], UDP, ISP2
192.168.20.11, [443], TCP, ISP1
192.168.20.12, [22], TCP, ISP2

# Por red
192.168.20.0/24, [80,443], TCP, ISP1
192.168.20.0/24, [53], UDP, ISP2
192.168.10.0/24, [443], TCP, ISP1
192.168.30.0/24, [443], TCP, ISP2

# WEB01 (ngrok)
172.16.50.20, [443], TCP, ISP1

# VPN-ADMIN, full tunnel
10.200.10.0/24, [80,443], TCP, ISP2

# PC-ADMIN01, ping
192.168.10.10, [], ICMP, ISP2
