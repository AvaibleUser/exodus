# /etc/sysctl.d/99-multiwan.conf - MWAN01
net.ipv4.ip_forward = 1

# rp_filter laxo: con dos salidas la respuesta puede entrar por el ISP que no es el de la ruta main
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# ARP solo por la interfaz que tiene la IP: el router de un ISP no debe aprender la IP del otro
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
