# /etc/multiwan/multiwan.conf - MWAN01
# Tras editar: mwan-apply && systemctl restart mwan-monitor

ISP1_IF=wan1
ISP1_IP=10.249.196.234
ISP1_GW=10.249.196.94
ISP1_NOMBRE="ISP1 Wi-Fi"

ISP2_IF=wan2
ISP2_IP=192.168.91.234
ISP2_GW=192.168.91.116
ISP2_NOMBRE="ISP2 Celular USB"

LAN_IF=t3

POLITICAS=/etc/multiwan/politicas.conf

# Trafico sin politica. hash: misma pareja origen/destino, mismo ISP (sesiones estables);
# conexion: azar por conexion segun pesos; rr: alterna ISP1/ISP2 e ignora pesos.
BALANCEO_MODO=hash
PESO_ISP1=50
PESO_ISP2=50

# Failover: basta que responda un objetivo por ese ISP.
# Caida tras 3 rondas fallidas (~15 s), recuperacion tras 3 exitosas (~10 s).
OBJETIVOS="8.8.8.8 1.1.1.1"
INTERVALO=3
FALLOS_PARA_CAIDA=3
EXITOS_PARA_RECUPERAR=3
