# /etc/rsyslog.d/30-multiwan-logs.conf - MWAN01
# politicas.log: una linea por conexion nueva (regla aplicada e ISP de salida)
if ($msg contains "MWAN-POL ") then {
    action(type="omfile" file="/var/log/multiwan/politicas.log" createDirs="on"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640")
    stop
}
# eventos.log: failover, recuperacion y aplicaciones de mwan-apply
if ($programname == "mwan-monitor" or $programname == "mwan-apply") then {
    action(type="omfile" file="/var/log/multiwan/eventos.log" createDirs="on"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640")
    stop
}
# filtro.log: paquetes descartados por el filtro de MWAN01
if ($msg contains "MWAN-IN " or $msg contains "MWAN-FWD ") then {
    action(type="omfile" file="/var/log/multiwan/filtro.log" createDirs="on"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640")
    stop
}
