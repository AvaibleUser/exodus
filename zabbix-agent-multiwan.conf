# /etc/zabbix/zabbix_agentd.conf.d/multiwan.conf - MWAN01
# Agente: Server=192.168.40.10, ListenIP=10.10.3.1, Hostname=MWAN01 (modo pasivo).
# Trafico por interfaz con claves nativas: net.if.in[wan1|wan2], net.if.out[wan1|wan2].

# 1 = UP, 0 = DOWN
UserParameter=mwan.estado[*],/usr/local/sbin/mwan-zabbix estado $1
# ms del ultimo ping de monitoreo, -1 sin respuesta
UserParameter=mwan.latencia[*],/usr/local/sbin/mwan-zabbix latencia $1
UserParameter=mwan.politicas,/usr/local/sbin/mwan-zabbix politicas
# ISP de la ruta por defecto (1 o 2)
UserParameter=mwan.activo,/usr/local/sbin/mwan-zabbix activo
