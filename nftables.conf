#!/usr/sbin/nft -f
# /etc/nftables.conf - MWAN01
# Filtro propio de MWAN01 y NAT. Las reglas de politicas/balanceo (tabla inet mwan)
# las genera mwan-apply en /var/lib/multiwan/mwan.nft, incluido al final.
flush ruleset

define LAN_IF   = "t3"
define WAN_IFS  = { "wan1", "wan2" }
define VPN01    = 172.16.60.2
define ZBX01    = 192.168.40.10
define ADMINS   = { 192.168.10.0/24, 10.200.10.0/24 }
define INTERNAS = { 192.168.10.0/24, 192.168.20.0/24, 192.168.30.0/24, 192.168.40.0/24,
                    10.10.1.0/30, 10.10.2.0/30, 10.10.3.0/30, 172.16.50.0/27, 172.16.60.0/29,
                    10.200.10.0/24, 10.200.20.0/24 }

table inet filtro {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        icmp type echo-request limit rate 10/second accept
        iifname $LAN_IF ip saddr $ADMINS tcp dport 22 counter accept comment "SSH solo admins"
        iifname $LAN_IF ip saddr $ZBX01 tcp dport 10050 counter accept comment "Agente Zabbix"
        limit rate 5/second log prefix "MWAN-IN DENY " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname $LAN_IF oifname $WAN_IFS ip saddr $INTERNAS counter accept comment "LAN -> Internet"
        iifname $WAN_IFS ip daddr $VPN01 udp dport 51820 ct status dnat log prefix "MWAN-FWD ALLOW WG " level info counter accept comment "Internet -> VPN01 (DNAT)"
        limit rate 5/second log prefix "MWAN-FWD DENY " level info
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname $WAN_IFS udp dport 51820 counter dnat to $VPN01 comment "WireGuard -> VPN01"
    }

    # masquerade toma la IP de la interfaz de salida (wan1 o wan2)
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN_IFS counter masquerade comment "SNAT por ISP"
    }
}

include "/var/lib/multiwan/*.nft"
